services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: trade_ai_db
    environment:
      POSTGRES_DB: trade_ai
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d trade_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trade_ai_network

  # One-shot schema owner. Application processes never call create_all.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      additional_contexts:
        commerce: ./commerce
    command: alembic upgrade head
    environment:
      - DATABASE_URL=postgresql+pg8000://admin:password@db:5432/trade_ai
    depends_on:
      db:
        condition: service_healthy
    networks:
      - trade_ai_network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: trade_ai_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - trade_ai_network
      - ai_gateway_network

  # Ephemeral retrieval cache. Knowledge snippets must not enter Redis AOF/backups.
  redis_cache:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - trade_ai_network

  # Signature updater/source for the worker's read-only ClamAV database.
  # ClamAV recommends a persistent /var/lib/clamav volume for *_base images.
  clamav:
    image: clamav/clamav:1.4_base
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - trade_ai_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      additional_contexts:
        commerce: ./commerce
    container_name: trade_ai_backend
    environment:
      - DATABASE_URL=postgresql+pg8000://admin:password@db:5432/trade_ai
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis_cache:6379/0
      - AGENT_RETRIEVAL_CACHE_ENABLED=${AGENT_RETRIEVAL_CACHE_ENABLED:-true}
      - AGENT_RETRIEVAL_CACHE_TTL_SECONDS=${AGENT_RETRIEVAL_CACHE_TTL_SECONDS:-60}
      - AGENT_CONCURRENCY_GLOBAL_LIMIT=${AGENT_CONCURRENCY_GLOBAL_LIMIT:-32}
      - AGENT_CONCURRENCY_ORG_LIMIT=${AGENT_CONCURRENCY_ORG_LIMIT:-16}
      - AGENT_CONCURRENCY_USER_LIMIT=${AGENT_CONCURRENCY_USER_LIMIT:-4}
      - AGENT_CONCURRENCY_PROVIDER_LIMIT=${AGENT_CONCURRENCY_PROVIDER_LIMIT:-16}
      - AGENT_CONCURRENCY_TOOL_LIMIT=${AGENT_CONCURRENCY_TOOL_LIMIT:-8}
      - AGENT_CONCURRENCY_LEASE_SECONDS=${AGENT_CONCURRENCY_LEASE_SECONDS:-300}
      - AGENT_FAST_PATH_ENABLED=${AGENT_FAST_PATH_ENABLED:-true}
      - AGENT_FAST_PATH_MAX_INPUT_CHARS=${AGENT_FAST_PATH_MAX_INPUT_CHARS:-240}
      - AGENT_FAST_PATH_MAX_HISTORY_MESSAGES=${AGENT_FAST_PATH_MAX_HISTORY_MESSAGES:-6}
      - AGENT_FAST_PATH_MAX_OUTPUT_TOKENS=${AGENT_FAST_PATH_MAX_OUTPUT_TOKENS:-800}
      - CELERY_BROKER_URL=redis://redis:6379/2
      - CELERY_RESULT_BACKEND=redis://redis:6379/3
      - SECRET_KEY=your-secret-key-change-in-production
      - AGENT_ORG_ID=${AGENT_ORG_ID:-ba6e0000-0000-0000-0000-000000000001}
      - DEPLOYMENT_ENVIRONMENT=${DEPLOYMENT_ENVIRONMENT:-development}
      - DEPLOYMENT_ID=${DEPLOYMENT_ID:-local}
      - DEBUG=False
      - LLM_BACKEND=${LLM_BACKEND:-direct}
      - OMNIROUTE_BASE_URL=http://omniroute:20128
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY:-}
      - OMNIROUTE_API_KEY_FILE=${OMNIROUTE_API_KEY_FILE:-}
      - AI_RUNTIME_SECRET_FILE=/app/data/secrets/omniroute_api_key
      - OMNIROUTE_ALLOWED_PROVIDERS=${OMNIROUTE_ALLOWED_PROVIDERS:-[]}
      - OMNIROUTE_MODEL_LEAD_CLASSIFICATION=${OMNIROUTE_MODEL_LEAD_CLASSIFICATION:-}
      - OMNIROUTE_MODEL_MESSAGE_DRAFT=${OMNIROUTE_MODEL_MESSAGE_DRAFT:-}
      - OMNIROUTE_MODEL_LIVE_REPLY=${OMNIROUTE_MODEL_LIVE_REPLY:-}
      - OMNIROUTE_MODEL_RAG_QUERY_REWRITE=${OMNIROUTE_MODEL_RAG_QUERY_REWRITE:-}
      - OMNIROUTE_MODEL_SUMMARIZATION=${OMNIROUTE_MODEL_SUMMARIZATION:-}
      - MEDIA_UPLOAD_ENABLED=${MEDIA_UPLOAD_ENABLED:-false}
      - MEDIA_PLANNING_ENABLED=${MEDIA_PLANNING_ENABLED:-false}
      - MEDIA_SUBMIT_ENABLED=${MEDIA_SUBMIT_ENABLED:-false}
      - MEDIA_SUBMIT_BATCH_SIZE=${MEDIA_SUBMIT_BATCH_SIZE:-5}
      - MEDIA_SUBMIT_LEASE_SECONDS=${MEDIA_SUBMIT_LEASE_SECONDS:-300}
      - MEDIA_SUBMIT_POLL_SECONDS=${MEDIA_SUBMIT_POLL_SECONDS:-10}
      - MEDIA_JOB_DEADLINE_SECONDS=${MEDIA_JOB_DEADLINE_SECONDS:-3600}
      - MEDIA_T2V_RESERVATION_CEILING_MICROUSD=${MEDIA_T2V_RESERVATION_CEILING_MICROUSD:-0}
      - MEDIA_PROVIDER_INPUT_TTL_SECONDS=${MEDIA_PROVIDER_INPUT_TTL_SECONDS:-3600}
      - MEDIA_INTENT_VAULT_DIR=/app/data/private/media-intents
      - MEDIA_INTENT_VAULT_KEY_FILE=/app/data/secrets/media-intent.key
      - MEDIA_RESULT_MAX_BYTES=${MEDIA_RESULT_MAX_BYTES:-1073741824}
      - MEDIA_RESULT_DOWNLOAD_TIMEOUT_SECONDS=${MEDIA_RESULT_DOWNLOAD_TIMEOUT_SECONDS:-60}
      - MEDIA_RECONCILE_BATCH_SIZE=${MEDIA_RECONCILE_BATCH_SIZE:-10}
      - MEDIA_RECONCILE_LEASE_SECONDS=${MEDIA_RECONCILE_LEASE_SECONDS:-300}
      - MEDIA_RECONCILE_POLL_SECONDS=${MEDIA_RECONCILE_POLL_SECONDS:-15}
      - MEDIA_RECONCILE_RETRY_SECONDS=${MEDIA_RECONCILE_RETRY_SECONDS:-30}
      - MEDIA_CALLBACK_ENABLED=${MEDIA_CALLBACK_ENABLED:-false}
      - MEDIA_CALLBACK_MAX_BODY_BYTES=${MEDIA_CALLBACK_MAX_BODY_BYTES:-262144}
      - MEDIA_FAL_WEBHOOK_USER_ID=${MEDIA_FAL_WEBHOOK_USER_ID:-}
      - MEDIA_FAL_WEBHOOK_URL=${MEDIA_FAL_WEBHOOK_URL:-}
      - MEDIA_FAL_JWKS_CACHE_SECONDS=${MEDIA_FAL_JWKS_CACHE_SECONDS:-3600}
      - MEDIA_FAL_JWKS_TIMEOUT_SECONDS=${MEDIA_FAL_JWKS_TIMEOUT_SECONDS:-5}
      - MEDIA_INSPECTION_ENABLED=${MEDIA_INSPECTION_ENABLED:-false}
      - MEDIA_THUMBNAIL_ENABLED=${MEDIA_THUMBNAIL_ENABLED:-false}
      - MEDIA_LIFECYCLE_ENABLED=${MEDIA_LIFECYCLE_ENABLED:-false}
      - MEDIA_OBJECT_STORE_BACKEND=${MEDIA_OBJECT_STORE_BACKEND:-local}
      - MEDIA_S3_ENDPOINT_URL=${MEDIA_S3_ENDPOINT_URL:-}
      - MEDIA_S3_REGION=${MEDIA_S3_REGION:-us-east-1}
      - MEDIA_S3_QUARANTINE_BUCKET=${MEDIA_S3_QUARANTINE_BUCKET:-}
      - MEDIA_S3_ASSET_BUCKET=${MEDIA_S3_ASSET_BUCKET:-}
      - MEDIA_S3_KEY_PREFIX=${MEDIA_S3_KEY_PREFIX:-}
      - MEDIA_S3_KMS_KEY_ID=${MEDIA_S3_KMS_KEY_ID:-}
      - MEDIA_FFMPEG_PATH=/usr/bin/ffmpeg
      - MEDIA_THUMBNAIL_MAX_BYTES=${MEDIA_THUMBNAIL_MAX_BYTES:-10485760}
      - MEDIA_RETENTION_DAYS=${MEDIA_RETENTION_DAYS:-30}
      - MEDIA_MAINTENANCE_USER_ID=${MEDIA_MAINTENANCE_USER_ID:-1}
      - MEDIA_RUNTIME_SECRET_DIR=/app/data/secrets/media-runtime
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
      - exports:/app/exports
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    networks:
      - trade_ai_network
      - ai_gateway_network

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      additional_contexts:
        commerce: ./commerce
    container_name: trade_ai_celery_worker
    command: celery -A app.tasks.celery_worker worker --loglevel=info --concurrency=4
    environment:
      - DATABASE_URL=postgresql+pg8000://admin:password@db:5432/trade_ai
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis_cache:6379/0
      - AGENT_RETRIEVAL_CACHE_ENABLED=${AGENT_RETRIEVAL_CACHE_ENABLED:-true}
      - AGENT_RETRIEVAL_CACHE_TTL_SECONDS=${AGENT_RETRIEVAL_CACHE_TTL_SECONDS:-60}
      - AGENT_CONCURRENCY_GLOBAL_LIMIT=${AGENT_CONCURRENCY_GLOBAL_LIMIT:-32}
      - AGENT_CONCURRENCY_ORG_LIMIT=${AGENT_CONCURRENCY_ORG_LIMIT:-16}
      - AGENT_CONCURRENCY_USER_LIMIT=${AGENT_CONCURRENCY_USER_LIMIT:-4}
      - AGENT_CONCURRENCY_PROVIDER_LIMIT=${AGENT_CONCURRENCY_PROVIDER_LIMIT:-16}
      - AGENT_CONCURRENCY_TOOL_LIMIT=${AGENT_CONCURRENCY_TOOL_LIMIT:-8}
      - AGENT_CONCURRENCY_LEASE_SECONDS=${AGENT_CONCURRENCY_LEASE_SECONDS:-300}
      - AGENT_FAST_PATH_ENABLED=${AGENT_FAST_PATH_ENABLED:-true}
      - AGENT_FAST_PATH_MAX_INPUT_CHARS=${AGENT_FAST_PATH_MAX_INPUT_CHARS:-240}
      - AGENT_FAST_PATH_MAX_HISTORY_MESSAGES=${AGENT_FAST_PATH_MAX_HISTORY_MESSAGES:-6}
      - AGENT_FAST_PATH_MAX_OUTPUT_TOKENS=${AGENT_FAST_PATH_MAX_OUTPUT_TOKENS:-800}
      - CELERY_BROKER_URL=redis://redis:6379/2
      - CELERY_RESULT_BACKEND=redis://redis:6379/3
      - SECRET_KEY=your-secret-key-change-in-production
      - AGENT_ORG_ID=${AGENT_ORG_ID:-ba6e0000-0000-0000-0000-000000000001}
      - DEBUG=False
      - LLM_BACKEND=${LLM_BACKEND:-direct}
      - OMNIROUTE_BASE_URL=http://omniroute:20128
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY:-}
      - OMNIROUTE_API_KEY_FILE=${OMNIROUTE_API_KEY_FILE:-}
      - AI_RUNTIME_SECRET_FILE=/app/data/secrets/omniroute_api_key
      - OMNIROUTE_ALLOWED_PROVIDERS=${OMNIROUTE_ALLOWED_PROVIDERS:-[]}
      - OMNIROUTE_MODEL_LEAD_CLASSIFICATION=${OMNIROUTE_MODEL_LEAD_CLASSIFICATION:-}
      - OMNIROUTE_MODEL_MESSAGE_DRAFT=${OMNIROUTE_MODEL_MESSAGE_DRAFT:-}
      - OMNIROUTE_MODEL_LIVE_REPLY=${OMNIROUTE_MODEL_LIVE_REPLY:-}
      - OMNIROUTE_MODEL_RAG_QUERY_REWRITE=${OMNIROUTE_MODEL_RAG_QUERY_REWRITE:-}
      - OMNIROUTE_MODEL_SUMMARIZATION=${OMNIROUTE_MODEL_SUMMARIZATION:-}
      - MEDIA_UPLOAD_ENABLED=${MEDIA_UPLOAD_ENABLED:-false}
      - MEDIA_PLANNING_ENABLED=${MEDIA_PLANNING_ENABLED:-false}
      - MEDIA_SUBMIT_ENABLED=${MEDIA_SUBMIT_ENABLED:-false}
      - MEDIA_SUBMIT_BATCH_SIZE=${MEDIA_SUBMIT_BATCH_SIZE:-5}
      - MEDIA_SUBMIT_LEASE_SECONDS=${MEDIA_SUBMIT_LEASE_SECONDS:-300}
      - MEDIA_SUBMIT_POLL_SECONDS=${MEDIA_SUBMIT_POLL_SECONDS:-10}
      - MEDIA_JOB_DEADLINE_SECONDS=${MEDIA_JOB_DEADLINE_SECONDS:-3600}
      - MEDIA_T2V_RESERVATION_CEILING_MICROUSD=${MEDIA_T2V_RESERVATION_CEILING_MICROUSD:-0}
      - MEDIA_PROVIDER_INPUT_TTL_SECONDS=${MEDIA_PROVIDER_INPUT_TTL_SECONDS:-3600}
      - MEDIA_INTENT_VAULT_DIR=/app/data/private/media-intents
      - MEDIA_INTENT_VAULT_KEY_FILE=/app/data/secrets/media-intent.key
      - MEDIA_RESULT_MAX_BYTES=${MEDIA_RESULT_MAX_BYTES:-1073741824}
      - MEDIA_RESULT_DOWNLOAD_TIMEOUT_SECONDS=${MEDIA_RESULT_DOWNLOAD_TIMEOUT_SECONDS:-60}
      - MEDIA_RECONCILE_BATCH_SIZE=${MEDIA_RECONCILE_BATCH_SIZE:-10}
      - MEDIA_RECONCILE_LEASE_SECONDS=${MEDIA_RECONCILE_LEASE_SECONDS:-300}
      - MEDIA_RECONCILE_POLL_SECONDS=${MEDIA_RECONCILE_POLL_SECONDS:-15}
      - MEDIA_SUBMIT_POLL_SECONDS=${MEDIA_SUBMIT_POLL_SECONDS:-10}
      - MEDIA_RECONCILE_RETRY_SECONDS=${MEDIA_RECONCILE_RETRY_SECONDS:-30}
      - MEDIA_CALLBACK_ENABLED=${MEDIA_CALLBACK_ENABLED:-false}
      - MEDIA_CALLBACK_MAX_BODY_BYTES=${MEDIA_CALLBACK_MAX_BODY_BYTES:-262144}
      - MEDIA_FAL_WEBHOOK_USER_ID=${MEDIA_FAL_WEBHOOK_USER_ID:-}
      - MEDIA_FAL_WEBHOOK_URL=${MEDIA_FAL_WEBHOOK_URL:-}
      - MEDIA_FAL_JWKS_CACHE_SECONDS=${MEDIA_FAL_JWKS_CACHE_SECONDS:-3600}
      - MEDIA_FAL_JWKS_TIMEOUT_SECONDS=${MEDIA_FAL_JWKS_TIMEOUT_SECONDS:-5}
      - MEDIA_INSPECTION_ENABLED=${MEDIA_INSPECTION_ENABLED:-false}
      - MEDIA_THUMBNAIL_ENABLED=${MEDIA_THUMBNAIL_ENABLED:-false}
      - MEDIA_LIFECYCLE_ENABLED=${MEDIA_LIFECYCLE_ENABLED:-false}
      - MEDIA_OBJECT_STORE_BACKEND=${MEDIA_OBJECT_STORE_BACKEND:-local}
      - MEDIA_S3_ENDPOINT_URL=${MEDIA_S3_ENDPOINT_URL:-}
      - MEDIA_S3_REGION=${MEDIA_S3_REGION:-us-east-1}
      - MEDIA_S3_QUARANTINE_BUCKET=${MEDIA_S3_QUARANTINE_BUCKET:-}
      - MEDIA_S3_ASSET_BUCKET=${MEDIA_S3_ASSET_BUCKET:-}
      - MEDIA_S3_KEY_PREFIX=${MEDIA_S3_KEY_PREFIX:-}
      - MEDIA_S3_KMS_KEY_ID=${MEDIA_S3_KMS_KEY_ID:-}
      - MEDIA_CLAMSCAN_PATH=/usr/bin/clamscan
      - MEDIA_FFPROBE_PATH=/usr/bin/ffprobe
      - MEDIA_FFMPEG_PATH=/usr/bin/ffmpeg
      - MEDIA_INSPECTION_TIMEOUT_SECONDS=${MEDIA_INSPECTION_TIMEOUT_SECONDS:-30}
      - MEDIA_INSPECTION_MAX_OUTPUT_BYTES=${MEDIA_INSPECTION_MAX_OUTPUT_BYTES:-1048576}
      - MEDIA_MAX_DURATION_SECONDS=${MEDIA_MAX_DURATION_SECONDS:-600}
      - MEDIA_MAX_DIMENSION_PIXELS=${MEDIA_MAX_DIMENSION_PIXELS:-8192}
      - MEDIA_THUMBNAIL_TIMEOUT_SECONDS=${MEDIA_THUMBNAIL_TIMEOUT_SECONDS:-60}
      - MEDIA_THUMBNAIL_PROCESS_OUTPUT_BYTES=${MEDIA_THUMBNAIL_PROCESS_OUTPUT_BYTES:-1048576}
      - MEDIA_THUMBNAIL_MAX_BYTES=${MEDIA_THUMBNAIL_MAX_BYTES:-10485760}
      - MEDIA_RETENTION_DAYS=${MEDIA_RETENTION_DAYS:-30}
      - MEDIA_CLEANUP_BATCH_SIZE=${MEDIA_CLEANUP_BATCH_SIZE:-100}
      - MEDIA_MAINTENANCE_USER_ID=${MEDIA_MAINTENANCE_USER_ID:-1}
      - MEDIA_RUNTIME_SECRET_DIR=/app/data/secrets/media-runtime
    volumes:
      - ./backend:/app:ro
      - uploads:/app/uploads
      - exports:/app/exports
      - clamav_data:/var/lib/clamav:ro
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,size=2147483648,mode=0700,noexec,nosuid,nodev
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
      clamav:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - trade_ai_network
      - ai_gateway_network

  # Internal AI Gateway. It is opt-in and never publishes a host port.
  omniroute:
    profiles: [gateway]
    build:
      context: https://github.com/diegosouzapw/OmniRoute.git#e0ce95c592c00f100f5141371dbda976d678ddee
      target: runner-base
    image: b-agent/omniroute:e0ce95c592c0
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      - DATA_DIR=/app/data
      - PORT=20128
      - DASHBOARD_PORT=20128
      - API_PORT=20129
      - API_HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379/4
      - NODE_OPTIONS=--max-old-space-size=2048
    expose:
      - "20128"
      - "20129"
    volumes:
      - omniroute_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 2g
    cpus: 2.0
    networks:
      - ai_gateway_network
      - ai_provider_egress_network

  # Celery Beat (Scheduler)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      additional_contexts:
        commerce: ./commerce
    container_name: trade_ai_celery_beat
    command: celery -A app.tasks.celery_worker beat --loglevel=info --schedule=/var/lib/celery/celerybeat-schedule
    environment:
      - DATABASE_URL=postgresql+pg8000://admin:password@db:5432/trade_ai
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/2
      - CELERY_RESULT_BACKEND=redis://redis:6379/3
      - MEDIA_RECONCILE_POLL_SECONDS=${MEDIA_RECONCILE_POLL_SECONDS:-15}
      - SECRET_KEY=your-secret-key-change-in-production
      - DEBUG=False
    volumes:
      - ./backend:/app
      - celery_beat_data:/var/lib/celery
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - trade_ai_network

  # Celery Flower (Monitoring)
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
      additional_contexts:
        commerce: ./commerce
    container_name: trade_ai_flower
    command: celery -A app.tasks.celery_worker flower --port=5555
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/2
      - CELERY_RESULT_BACKEND=redis://redis:6379/3
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trade_ai_network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: trade_ai_frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
      - VITE_API_PROXY_TARGET=http://backend:8000
      - VITE_HMR_HOST=${VITE_HMR_HOST:-}
      - VITE_HMR_CLIENT_PORT=${VITE_HMR_CLIENT_PORT:-3000}
      - VITE_USE_POLLING=${VITE_USE_POLLING:-true}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - trade_ai_network

  # Nginx (Reverse Proxy - Optional)
  nginx:
    image: nginx:alpine
    container_name: trade_ai_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - trade_ai_network
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
  uploads:
  exports:
  celery_beat_data:
  omniroute_data:
  frontend_node_modules:
  clamav_data:

networks:
  trade_ai_network:
    driver: bridge
  ai_gateway_network:
    driver: bridge
    internal: true
  ai_provider_egress_network:
    driver: bridge
