[pytest]
# -p by entry-point name loads asyncio whether or not plugin autoload is disabled (a module
# path registers it twice when it is on); importlib mode lets suites share file names.
addopts = -p asyncio --import-mode=importlib
asyncio_mode = auto
# The examples import each other as top-level packages (retail.api, demo_common), as
# uvicorn --app-dir examples runs them.
pythonpath = examples
testpaths =
    tests
    commerce-common/tests
    shopping-agent/core/tests
    shopping-agent/runtime-messages-api/tests
    shopping-agent/runtime-agent-sdk/tests
    shopping-agent/managed-agents/storefront-mcp-server/tests
    merchant-agent/core/tests
    merchant-agent/runtime-messages-api/tests
    merchant-agent/runtime-agent-sdk/tests
    merchant-agent/managed-agents/merchant-mcp-server/tests
    examples/demo_common/tests
    examples/retail/api/tests
    examples/travel/api/tests
    examples/telecom/api/tests
    examples/entertainment/api/tests
