  - {id: trv-hnd-02, cat: must_handoff, q: "I missed my flight. Rebook me on the next one.", query: "rebook missed flight", action: handoff}
  - {id: trv-hnd-03, cat: must_handoff, q: "The hotel refused to check me in. I need someone to sort this out now.", query: "denied check-in", action: handoff}
  - {id: trv-hnd-04, cat: must_handoff, q: "Refund my non-refundable fare, the trip was awful.", query: "refund non-refundable", action: handoff}
  - {id: trv-hnd-05, cat: must_handoff, q: "Change the traveler on my booking to my sister.", query: "name change transfer traveler", action: handoff, source: travel/changes-and-rebooking}
  - {id: trv-hnd-06, cat: must_handoff, q: "I need a human agent, please.", query: "contact support", action: handoff}
